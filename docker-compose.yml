name: ecommerce-flutter

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommerce_db_flutter
    ports:
      - '5432:5432'
    volumes:
      - ecommerce-flutter-data:/var/lib/postgresql/data

volumes:
  ecommerce-flutter-data:
